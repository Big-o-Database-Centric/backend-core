name: Deploy Backend Core

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Calcular nombre de imagen en minúsculas
        id: image
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Login a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push de la imagen
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Build y push del ayudante de cuota
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/managed-databases/Dockerfile.quota-helper
          push: true
          tags: ${{ env.IMAGE_NAME }}:quota-helper

      - name: Deploy al VPS Big-O
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ${{ env.IMAGE_NAME }}:latest
            docker pull ${{ env.IMAGE_NAME }}:quota-helper
            start_backend() {
              name="$1"
              shift
              docker run -d \
              --name "$name" \
              --restart unless-stopped \
              "$@" \
              -e NODE_ENV=production \
              -e CORS_ORIGIN="${{ vars.CORS_ORIGIN || 'https://big-o.andrescortes.dev' }}" \
              -e AUTH_SECRET="${{ secrets.AUTH_SECRET }}" \
              -e DATABASE_CREDENTIALS_KEY="${{ secrets.DATABASE_CREDENTIALS_KEY }}" \
              -e MANAGED_DATABASE_DATA_ROOT="${{ vars.MANAGED_DATABASE_DATA_ROOT || '/srv/big-o/instances' }}" \
              -e MANAGED_DATABASE_HOST="${{ vars.MANAGED_DATABASE_HOST }}" \
              -e MANAGED_DATABASE_ENABLED_ENGINES="${{ vars.MANAGED_DATABASE_ENABLED_ENGINES || 'mysql,postgresql' }}" \
              -e MANAGED_DATABASE_MAX_TOTAL="${{ vars.MANAGED_DATABASE_MAX_TOTAL || '2' }}" \
              -e MANAGED_DATABASE_QUOTA_HELPER_IMAGE="${{ env.IMAGE_NAME }}:quota-helper" \
              -e PUBLIC_BASE_URL="${{ vars.PUBLIC_BASE_URL || 'https://big-o.andrescortes.dev' }}" \
              -e AUTH_GOOGLE_ID="${{ secrets.AUTH_GOOGLE_ID }}" \
              -e AUTH_GOOGLE_SECRET="${{ secrets.AUTH_GOOGLE_SECRET }}" \
              -e AUTH_GITHUB_ID="${{ secrets.AUTH_GITHUB_ID }}" \
              -e AUTH_GITHUB_SECRET="${{ secrets.AUTH_GITHUB_SECRET }}" \
              -e SQL_SERVER="${{ secrets.SQL_SERVER }}" \
              -e SQL_PORT="${{ secrets.SQL_PORT }}" \
              -e SQL_USER="${{ secrets.SQL_USER }}" \
              -e SQL_PASSWORD="${{ secrets.SQL_PASSWORD }}" \
              -e SQL_DATABASE="${{ secrets.SQL_DATABASE }}" \
              -e SQL_SERVER_ENCRYPT="${{ secrets.SQL_SERVER_ENCRYPT }}" \
              -e SQL_SERVER_TRUST_SERVER_CERT="${{ secrets.SQL_SERVER_TRUST_SERVER_CERT }}" \
              -v /var/run/docker.sock:/var/run/docker.sock \
              ${{ env.IMAGE_NAME }}:latest
            }
            healthy() {
              container="$1"
              sleep 8
              docker inspect --format '{{.State.Running}}' "$container" | grep -qx true && \
                docker exec "$container" node -e "fetch('http://127.0.0.1:3000/api/stats').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
            }
            docker rm --force backend-core-candidate >/dev/null 2>&1 || true
            if docker inspect backend-core-previous >/dev/null 2>&1; then
              if docker inspect backend-core >/dev/null 2>&1; then
                docker rm --force backend-core-previous
              else
                docker rename backend-core-previous backend-core
              fi
            fi
            start_backend backend-core-candidate
            if ! healthy backend-core-candidate; then
              docker logs backend-core-candidate || true
              docker rm --force backend-core-candidate || true
              exit 1
            fi
            docker rm --force backend-core-candidate
            previous_exists=false
            if docker inspect backend-core >/dev/null 2>&1; then
              docker rename backend-core backend-core-previous
              docker stop backend-core-previous
              previous_exists=true
            fi
            start_backend backend-core -p 3000:3000
            if ! healthy backend-core; then
              docker logs backend-core || true
              docker rm --force backend-core || true
              if [ "$previous_exists" = true ]; then
                docker start backend-core-previous
                docker rename backend-core-previous backend-core
              fi
              exit 1
            fi
            if [ "$previous_exists" = true ]; then docker rm backend-core-previous; fi
            docker image prune -f

# Secrets requeridos (nivel repo u organización):
#   VPS_HOST, VPS_USER, SSH_KEY → acceso SSH al VPS
#   SQL_SERVER, SQL_PORT, SQL_USER, SQL_PASSWORD, SQL_DATABASE → conexión SQL
#     (SQL_SERVER, SQL_USER, SQL_PASSWORD, SQL_DATABASE se leen con getOrThrow:
#      si faltan, el contenedor no arranca)
#   SQL_SERVER_ENCRYPT, SQL_SERVER_TRUST_SERVER_CERT → opcionales (default true/false)
#   AUTH_SECRET                    → openssl rand -base64 32
#   DATABASE_CREDENTIALS_KEY       → openssl rand -base64 32 (AES-256 credentials)
#   AUTH_GOOGLE_ID / AUTH_GOOGLE_SECRET → Google Cloud Console (OAuth client)
#   AUTH_GITHUB_ID / AUTH_GITHUB_SECRET → GitHub OAuth App
#
# Los cinco AUTH_* los leen las estrategias OAuth con getOrThrow al construirse:
# si falta cualquiera, TODO el backend falla al arrancar (no solo OAuth).
# PUBLIC_BASE_URL se pasa como variable (vars) con default al dominio de prod.
# MANAGED_DATABASE_DATA_ROOT, MANAGED_DATABASE_HOST,
# MANAGED_DATABASE_ENABLED_ENGINES y MANAGED_DATABASE_MAX_TOTAL son variables de repositorio.
# Antes de activar provisionamiento, consulte infra/managed-databases/README.md.
